name: Jayver Dev Windows Installer

on:
  push:
    branches: [main]
    paths-ignore:
      - "latest-dev.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jayver-dev-installer
  cancel-in-progress: false

jobs:
  build-windows-installer:
    name: Build Windows NSIS setup
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Detect updater signing configuration
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ -n "$SIGNING_KEY" && -n "$PUBLIC_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set unique development version
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/set-dev-version.mjs "${{ github.run_number }}"

      - name: Build and publish signed dev updater
        if: steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          VITE_JAYVER_UPDATER_ENABLED: "true"
        with:
          tagName: jayver-dev-${{ github.run_number }}
          releaseName: Jayver Dev Build ${{ github.run_number }}
          releaseBody: |
            Signed automated development build from main.

            Commit: ${{ github.sha }}

            This is a testing build, not a production release.
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Build unsigned dev installer (updater disabled)
        if: steps.signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_JAYVER_UPDATER_ENABLED: "false"
        with:
          tagName: jayver-dev-${{ github.run_number }}
          releaseName: Jayver Dev Build ${{ github.run_number }}
          releaseBody: |
            Unsigned development installer from main.
            In-app updates are disabled until updater signing keys are configured.

            Commit: ${{ github.sha }}
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: false
          args: --bundles nsis

      - name: Publish latest dev update manifest
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: jayver-dev-${{ github.run_number }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            const manifestAsset = release.data.assets.find((asset) => asset.name === "latest.json");
            if (!manifestAsset) throw new Error("Tauri did not attach latest.json to the dev release.");

            const response = await fetch(manifestAsset.browser_download_url);
            if (!response.ok) throw new Error(`Unable to download updater manifest: ${response.status}`);
            const manifestText = await response.text();
            JSON.parse(manifestText);

            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "latest-dev.json",
                ref: "main"
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "latest-dev.json",
              message: `Publish Jayver dev updater manifest ${tag}`,
              content: Buffer.from(manifestText).toString("base64"),
              sha
            });
